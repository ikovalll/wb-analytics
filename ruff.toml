line-length = 88
target-version = "py313"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RET", "ARG", "C4", "PTH"]
# Кириллица в комментариях и строках — норма для этого проекта.
ignore = ["RUF001", "RUF002", "RUF003"]

[lint.per-file-ignores]
# ARG001 — фикстуры pytest часто нужны ради побочного эффекта, а не значения.
# ARG002 — подставные объекты обязаны повторять сигнатуру настоящих.
"tests/*" = ["ARG001", "ARG002"]
